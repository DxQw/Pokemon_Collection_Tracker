<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Cards Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(15, 23, 42, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --card-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Sticky Glassmorphic Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ef4444 50%, #f8fafc 50%);
      border-radius: 50%;
      border: 3px solid #0f172a;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(to right, #f8fafc, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 380px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 99px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    /* Main Container */
    main {
      max-width: 1280px;
      margin: 32px auto 0;
      padding: 0 24px;
    }

    .stats-bar {
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Card Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px;
    }

    /* Card Styling & Hover Effects */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
    }

    .image-wrapper {
      width: 100%;
      aspect-ratio: 2.5 / 3.5;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .card-info {
      width: 100%;
      margin-top: 12px;
      text-align: center;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Load More Button */
    .action-container {
      display: flex;
      justify-content: center;
      margin-top: 48px;
    }

    .btn-load {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .btn-load:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    /* Skeleton Loading State */
    .skeleton {
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"></div>
      <h1>Pokémon Vault</h1>
    </div>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Search Pokémon name or ID..." oninput="handleSearch()">
    </div>
  </header>

  <main>
    <div class="stats-bar" id="statsBar">Loading card collection...</div>
    <div class="grid" id="cardContainer"></div>
    
    <div class="action-container">
      <button id="loadMoreBtn" class="btn-load" style="display: none;" onclick="loadNextBatch()">Load More Cards</button>
    </div>
  </main>

  <script>
    let allCards = [];
    let filteredCards = [];
    let currentPage = 1;
    const pageSize = 36;

    async function init() {
      showSkeletons();
      try {
        const response = await fetch("https://api.tcgdex.net/v2/en/cards");
        const data = await response.json();

        const seenIds = new Set();
        allCards = [];

        data.forEach(card => {
          if (card.image && !seenIds.has(card.id)) {
            seenIds.add(card.id);
            allCards.push({
              id: card.id,
              name: card.name || card.id,
              image: `${card.image}/high.webp`
            });
          }
        });

        filteredCards = [...allCards];
        renderBatch();
      } catch (err) {
        document.getElementById('cardContainer').innerHTML = 
          `<p style="grid-column: 1/-1; text-align:center; color: #f87171; padding: 40px;">
            Failed to connect to TCGdex API. Please check your internet connection.
          </p>`;
      }
    }

    function showSkeletons() {
      const container = document.getElementById("cardContainer");
      container.innerHTML = Array(12).fill(0).map(() => `
        <div class="card skeleton">
          <div class="image-wrapper"></div>
          <div class="card-info">
            <div style="height: 16px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 8px;"></div>
            <div style="height: 12px; background: rgba(255,255,255,0.05); border-radius: 4px; width: 50%; margin: 0 auto;"></div>
          </div>
        </div>
      `).join('');
    }

    function renderBatch() {
      const container = document.getElementById("cardContainer");
      const loadBtn = document.getElementById("loadMoreBtn");
      const stats = document.getElementById("statsBar");

      const endIndex = currentPage * pageSize;
      const cardsToDisplay = filteredCards.slice(0, endIndex);

      stats.textContent = `Showing ${cardsToDisplay.length} of ${filteredCards.length} cards`;

      if (cardsToDisplay.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding: 60px;">No cards found matching your search.</p>`;
        loadBtn.style.display = 'none';
        return;
      }

      container.innerHTML = cardsToDisplay.map(card => `
        <div class="card">
          <div class="image-wrapper">
            <img 
              src="${card.image}" 
              alt="${card.name}" 
              loading="lazy"
              onerror="this.onerror=null; this.src='https://assets.tcgdex.net/en/assets/card_back.png';"
            >
          </div>
          <div class="card-info">
            <div class="card-title" title="${card.name}">${card.name}</div>
            <div class="card-id">${card.id}</div>
          </div>
        </div>
      `).join('');

      loadBtn.style.display = endIndex < filteredCards.length ? 'inline-block' : 'none';
    }

    function loadNextBatch() {
      currentPage++;
      renderBatch();
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      currentPage = 1;

      filteredCards = allCards.filter(card => 
        !query || 
        card.id.toLowerCase().includes(query) || 
        card.name.toLowerCase().includes(query)
      );
      renderBatch();
    }

    init();
  </script>
</body>
</html>
