<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Cards Vault (API Streamed)</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333;
      --accent-color: #2a75bb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0 0 8px 0;
      color: var(--accent-color);
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    input {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 320px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background-color: #eee;
      min-height: 240px;
      object-fit: cover;
    }

    .card-title {
      font-weight: bold;
      margin-top: 8px;
      font-size: 14px;
    }

    .card-number {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .load-more-container {
      text-align: center;
      margin: 30px 0;
    }

    .btn-load {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pokémon Cards Vault</h1>
    <p style="color: #666; margin: 0;">Source: Streamed via TCGdex API</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by Pokémon name or Card ID..." oninput="handleSearch()">
  </div>

  <div class="grid" id="cardContainer">
    <p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">
      Loading cards from API...
    </p>
  </div>

  <div class="load-more-container">
    <button id="loadMoreBtn" class="btn-load" style="display: none;" onclick="loadNextBatch()">Load More Cards</button>
  </div>

  <script>
    let allCards = [];
    let filteredCards = [];
    let currentPage = 1;
    const pageSize = 40;

    async function init() {
      try {
        // Fetch English card index from TCGdex API
        const response = await fetch("https://api.tcgdex.net/v2/en/cards");
        const data = await response.json();

        // Deduplicate cards by ID and ensure image existence
        const seenIds = new Set();
        allCards = [];

        data.forEach(card => {
          if (card.image && !seenIds.has(card.id)) {
            seenIds.add(card.id);
            allCards.push({
              id: card.id,
              name: card.name || card.id,
              // TCGdex high-res image CDN format
              image: `${card.image}/high.webp`
            });
          }
        });

        filteredCards = [...allCards];
        renderBatch();
      } catch (err) {
        document.getElementById('cardContainer').innerHTML = 
          `<p style="grid-column: 1/-1; text-align:center; color: #dc2626; padding: 20px;">
            <b>Failed to load cards from TCGdex API.</b>
          </p>`;
      }
    }

    function renderBatch() {
      const container = document.getElementById("cardContainer");
      const loadBtn = document.getElementById("loadMoreBtn");
      
      const endIndex = currentPage * pageSize;
      const cardsToDisplay = filteredCards.slice(0, endIndex);

      if (cardsToDisplay.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 40px; color: #777;">No cards match your search.</p>';
        loadBtn.style.display = 'none';
        return;
      }

      container.innerHTML = cardsToDisplay.map(card => `
        <div class="card">
          <img 
            src="${card.image}" 
            alt="${card.name}" 
            loading="lazy"
            onerror="this.onerror=null; this.src='https://assets.tcgdex.net/en/assets/card_back.png';"
          >
          <div class="card-title">${card.name}</div>
          <span class="card-number">${card.id}</span>
        </div>
      `).join('');

      loadBtn.style.display = endIndex < filteredCards.length ? 'inline-block' : 'none';
    }

    function loadNextBatch() {
      currentPage++;
      renderBatch();
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      currentPage = 1;

      filteredCards = allCards.filter(card => 
        !query || 
        card.id.toLowerCase().includes(query) || 
        card.name.toLowerCase().includes(query)
      );
      renderBatch();
    }

    init();
  </script>
</body>
</html>
