<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local English Cards Vault</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333;
      --accent-color: #2a75bb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0 0 8px 0;
      color: var(--accent-color);
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    input {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 320px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background-color: #eee;
      min-height: 240px;
      object-fit: cover;
    }

    .card-title {
      font-weight: bold;
      margin-top: 8px;
      font-size: 14px;
    }

    .card-number {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .load-more-container {
      text-align: center;
      margin: 30px 0;
    }

    .btn-load {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Local English Cards Vault</h1>
    <p style="color: #666; margin: 0;">Source: pokemon_art_rarities/en/</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by Pokémon name or Card ID..." oninput="handleSearch()">
  </div>

  <div class="grid" id="cardContainer"></div>

  <div class="load-more-container">
    <button id="loadMoreBtn" class="btn-load" style="display: none;" onclick="loadNextBatch()">Load More Cards</button>
  </div>

  <!-- Loads manifest.js directly from the root workspace directory -->
  <script src="./manifest.js"></script>

  <script>
    const FOLDER_PATH = "./pokemon_art_rarities/en/";
    let localCards = [];
    let filteredCards = [];
    let currentPage = 1;
    const pageSize = 40;

    function init() {
      if (typeof window.LOCAL_IMAGE_FILES === 'undefined') {
        document.getElementById('cardContainer').innerHTML = 
          `<p style="grid-column: 1/-1; text-align:center; color: #dc2626; padding: 20px;">
            <b>manifest.js not found in root directory!</b><br><br>
            Run <code>python generate_manifest.py</code> to generate the index.
          </p>`;
        return;
      }

      // Deduplication check during card parsing
      const seenIds = new Set();
      localCards = [];

      window.LOCAL_IMAGE_FILES.forEach(item => {
        let cardObj;
        if (typeof item === 'string') {
          const cleanName = item.substring(0, item.lastIndexOf('.')).replace(/_/g, '/');
          cardObj = {
            id: cleanName,
            name: cleanName,
            filePath: FOLDER_PATH + item
          };
        } else {
          cardObj = {
            id: item.id,
            name: item.name || item.id,
            filePath: FOLDER_PATH + item.filename
          };
        }

        // Push card only if its Card ID hasn't been added yet
        if (!seenIds.has(cardObj.id)) {
          seenIds.add(cardObj.id);
          localCards.push(cardObj);
        }
      });

      filteredCards = [...localCards];
      renderBatch();
    }

    function renderBatch() {
      const container = document.getElementById("cardContainer");
      const loadBtn = document.getElementById("loadMoreBtn");
      
      const endIndex = currentPage * pageSize;
      const cardsToDisplay = filteredCards.slice(0, endIndex);

      if (cardsToDisplay.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 40px; color: #777;">No local cards match your query.</p>';
        loadBtn.style.display = 'none';
        return;
      }

      container.innerHTML = cardsToDisplay.map(card => `
        <div class="card">
          <img src="${card.filePath}" alt="${card.name}" loading="lazy">
          <div class="card-title">${card.name}</div>
          <span class="card-number">${card.id}</span>
        </div>
      `).join('');

      loadBtn.style.display = endIndex < filteredCards.length ? 'inline-block' : 'none';
    }

    function loadNextBatch() {
      currentPage++;
      renderBatch();
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      currentPage = 1;

      filteredCards = localCards.filter(card => 
        !query || 
        card.id.toLowerCase().includes(query) || 
        card.name.toLowerCase().includes(query)
      );
      renderBatch();
    }

    init();
  </script>
</body>
</html>
